spring.application.name=deber-principios-de-diseno
server.address=127.0.0.1
server.port=8080
# Copia de Northwind incluida: se carga automaticamente al iniciar.
spring.datasource.url=jdbc:h2:mem:northwind;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.cache.type=simple
spring.cache.cache-names=pedidos
server.error.include-message=never